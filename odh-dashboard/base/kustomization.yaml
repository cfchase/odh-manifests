apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app: odh-dashboard
  app.kubernetes.io/part-of: odh-dashboard
resources:
- odh-dashboard-crd.yaml
- odh-quick-start-crd.yaml
- odh-document-crd.yaml
- odh-application-crd.yaml
- role.yaml
- cluster-role.yaml
- service-account.yaml
- role-binding.yaml
- cluster-role-binding.yaml
- cluster-monitoring-role-binding.yaml
- deployment.yaml
- routes.yaml
- service.yaml
- create-jupyter-notebook-quickstart.yaml
- deploy-python-model-quickstart.yaml
- jupyter-app.yaml
- jupyterhub-app.yaml
- jupyter-docs.yaml

images:
- name: odh-dashboard
  newName: quay.io/cfchase/odh-dashboard
  newTag: aisrhods-odh
