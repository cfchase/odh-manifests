---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
bases:
  # - ../crd
  - ../rbac
  - ../manager
  - ../webhook
# Adds namespace to all resources.
namespace: opendatahub
# Value of this field is prepended to the names of all resources, e.g. a
# deployment named "wordpress" becomes "alices-wordpress". Note that it should
# also match with the prefix (text before '-') of the namespace field above.
namePrefix: openshift-notebook-controller-
# Labels to add to all resources and selectors.
commonLabels:
  app: openshift-notebook-controller
  kustomize.component: openshift-notebook-controller
  component.opendatahub.io/name: openshift-notebook-controller
  opendatahub.io/component: "true"
  app.kubernetes.io/part-of: notebook-controller
patchesStrategicMerge:
  - webhook_manager_patch.yaml
